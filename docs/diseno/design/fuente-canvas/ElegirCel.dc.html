<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Elegir equipo · celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; min-height: 1438px; display: flex; flex-direction: column; background: {{t.bg}}; color: {{t.tx}}; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-variant-numeric: tabular-nums">

  <section style="background: {{t.hero}}; color: {{t.heroTx}}; padding: 0 16px 24px">
    <header style="height: 52px; display: flex; align-items: center; gap: 10px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 17H3z"></path><path d="M12 11l3.5 6h-7z" fill="#EAB308" stroke="none"></path></svg>
      <span style="font-size: 20px; font-weight: 800; font-style: italic; letter-spacing: -0.5px">LigaPro</span>
      <span style="background: #EAB308; color: #02224B; font-size: 10px; font-weight: 800; letter-spacing: 1px; padding: 3px 7px; border-radius: 4px">CALCULADORA</span>
    </header>
    <h1 style="margin: 20px 0 0; font-size: 32px; line-height: 1.1; font-weight: 800; letter-spacing: -0.5px">¿De qué cuadro sos?</h1>
    <p style="margin: 8px 0 0; font-size: 15px; line-height: 1.4; color: {{t.heroTx2}}">Elegilo una vez y la calculadora arranca siempre por tu equipo: sus chances, su próximo partido y su tabla.</p>
    <label style="display: block; margin-top: 18px">
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscá tu cuadro</span>
      <span style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; background: {{t.card}}; border-radius: 8px; border: 2px solid #EAB308">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{t.tx2}}" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
        <input type="search" placeholder="Buscá por nombre, ej. Poquitos" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 16px; color: {{t.tx}}; font-family: inherit">
      </span>
    </label>
  </section>

  <main style="flex: 1; padding: 16px 12px 24px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{series}}" as="s" hint-placeholder-count="3">
      <h2 style="margin: 10px 4px 0; font-size: 13px; font-weight: 800; letter-spacing: 0.8px; color: {{t.tx2}}">{{s.name}}</h2>
      <sc-for list="{{s.divs}}" as="d" hint-placeholder-count="3">
        <div style="background: {{t.card}}; border-radius: 10px; box-shadow: {{t.shadow}}; overflow: hidden">
          <button aria-expanded="{{d.open}}" style="width: 100%; height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 16px; background: none; border: 0; color: {{t.tx}}; font-family: inherit; text-align: left">
            <span style="flex: 1; font-size: 15px; font-weight: 800">{{d.name}}</span>
            <span style="font-size: 13px; color: {{t.tx2}}">{{d.meta}}</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{t.tx2}}" stroke-width="2.4" stroke-linecap="round" aria-hidden="true" style="{{d.rot}}"><path d="M6 9l6 6 6-6"></path></svg>
          </button>
          <sc-if value="{{d.open}}" hint-placeholder-val="{{false}}">
            <ul style="list-style: none; margin: 0; padding: 0; border-top: 1px solid {{t.line}}">
              <sc-for list="{{d.teams}}" as="tm" hint-placeholder-count="10">
                <li style="border-bottom: 1px solid {{t.line}}">
                  <button style="width: 100%; min-height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: none; border: 0; color: {{t.tx}}; font-family: inherit; text-align: left">
                    <span style="width: 30px; height: 30px; border-radius: 50%; background: {{tm.c}}; color: #FFFFFF; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{tm.ab}}</span>
                    <span style="flex: 1; min-width: 0; font-size: 15px; font-weight: 600; line-height: 1.25">{{tm.n}}</span>
                    <span style="font-size: 13px; color: {{t.tx2}}; white-space: nowrap">{{tm.pos}}</span>
                  </button>
                </li>
              </sc-for>
            </ul>
          </sc-if>
        </div>
      </sc-for>
    </sc-for>
    <p style="margin: 12px 4px 0; font-size: 13px; line-height: 1.4; color: {{t.tx2}}">Lo guardamos en este celular. Lo cambiás cuando quieras desde Mi equipo.</p>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":1438}}'>
class Component extends DCLogic {
lp(){
const T={
light:{bg:'#E5E7EB',card:'#FFFFFF',sub:'#F3F4F6',line:'#E5E7EB',line2:'#D1D5DB',tx:'#111827',tx2:'#4B5563',tx3:'#6B7280',hero:'#02224B',heroTx:'#FFFFFF',heroTx2:'#CBD5E1',shadow:'0 1px 2px rgba(2,34,75,0.08)'},
dark:{bg:'#0B1220',card:'#131C2F',sub:'#1A2540',line:'#1F2A44',line2:'#2C3A5A',tx:'#F1F5F9',tx2:'#A9B4C8',tx3:'#8D98AE',hero:'#0A2A5C',heroTx:'#FFFFFF',heroTx2:'#C3CEE0',shadow:'0 1px 2px rgba(0,0,0,0.4)'}};
const TEAMS=[['UDEM','U','#312E81'],['El Tunel FC','ET','#0F766E'],['La Pampara F.C','LP','#155E75'],['Croacia Fútbol Club','C','#1E40AF'],['Deportivo 29','D2','#166534'],['La Blanca F.C','LB','#0E7490'],['Los Poquitos De Siempre FC','LP','#6B21A8'],['Prado F.C','P','#991B1B'],['Burmese FC','B','#7E22CE'],['Del Oeste FC','DO','#713F12']];
return {T,TEAMS};
}
  renderVals() {
    const {T,TEAMS} = this.lp();
    const t = T[this.props.dark ? 'dark' : 'light'];
    const teams = TEAMS.map((r, i) => ({ n: r[0], ab: r[1], c: r[2], pos: (i + 1) + 'º' }));
    const closed = (name) => ({ name, meta: '', open: false, rot: '', teams: [] });
    const series = [
      { name: 'SERIE 9', divs: [closed('Divisional A'), closed('Divisional B'), { name: 'Divisional C', meta: '10 equipos', open: true, rot: 'transform: rotate(180deg)', teams }] },
      { name: 'SERIE 6', divs: [closed('Divisional A'), closed('Divisional B')] },
      { name: 'SERIE 3', divs: [closed('Divisional C'), closed('Divisional D')] }
    ];
    return { t, series };
  }
}
</script>
</body>
</html>
