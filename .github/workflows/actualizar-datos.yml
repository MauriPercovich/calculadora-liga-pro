name: Actualizar datos

# Cada 30 minutos de 9:00 a 1:00 (hora de Uruguay, UTC-3): baja los campeonatos en curso
# de ligapro.uy, recalcula las probabilidades y, si algo cambió, lo sube al repo.
# Vercel publica solo cada commit nuevo.
#
# GitHub demora o saltea corridas programadas cuando tiene carga, sobre todo en los
# minutos redondos: por eso corre dos veces por hora y en minutos poco usados.
on:
  schedule:
    - cron: "17,47 12-23 * * *"
    - cron: "17,47 0-4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # El detalle de cada campeonato no cambia: guardarlo entre corridas ahorra
      # cientos de pedidos (la API permite ~60 por minuto) y acorta la corrida.
      - name: Recuperar datos ya bajados
        uses: actions/cache@v4
        with:
          path: data/raw/tournaments-detail-cache.json
          key: ligapro-raw-${{ github.run_id }}
          restore-keys: ligapro-raw-

      - name: Bajar campeonatos en curso
        run: node scripts/import.mjs --desde 2026 --solo-actual

      - name: Recalcular probabilidades
        run: npx tsx scripts/build-data.ts

      - name: Subir si cambió algo
        run: |
          if git diff --quiet -- public/data/divisionales; then
            echo "Sin cambios en los partidos ni en las tablas."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "Actualiza datos de Liga Pro"
          # Si mientras corría se subieron otros commits, el push se rechaza:
          # se integran (los datos solo los toca esta Action) y se reintenta.
          for intento in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rechazado (intento $intento), integro lo nuevo y reintento…"
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
            sleep $((intento * 5))
          done
          echo "No se pudo subir después de 5 intentos."
          exit 1
